# Copy this file to .streamlit/secrets.toml for LOCAL development.
# NEVER commit the real secrets.toml to GitHub (it's already in .gitignore).
#
# On Streamlit Community Cloud: go to your app > Settings > Secrets
# and paste the same key = "value" lines there instead of uploading this file.
#
# Get a FREE Groq API key (no billing required) at:
# https://console.groq.com/keys

GROQ_API_KEY = "gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Optional: model override. Defaults to "llama-3.3-70b-versatile" if omitted.
GROQ_MODEL = "llama-3.3-70b-versatile"
